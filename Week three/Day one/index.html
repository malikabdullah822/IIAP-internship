<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Set character encoding for the document -->
    <meta charset="UTF-8">
    <!-- Ensure responsive scaling across different mobile and desktop viewports -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Define the title of the web page shown in the browser tab -->
    <title>Week 3 - Day 1: Modern JS Dashboard</title>
    <!-- Link the external CSS stylesheet for styling the page layout -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main container wrapping the dashboard content -->
    <div class="dashboard-card">
        <!-- Main heading displaying the airport project title -->
        <h2>Islamabad Airport Portal</h2>
        <!-- Subtitle describing the current development stage -->
        <p class="subtitle">Week 3: Modern JavaScript & ES6</p>

        <!-- Container where JavaScript will inject the dynamic ES6 announcement -->
        <div id="announcement-box" class="announcement-box">
            <!-- Dynamic content will be loaded here via JavaScript -->
        </div>
    </div>

    <!-- Link the external JavaScript file containing ES6 logic -->
    <script src="script.js"></script>
</body>
</html>
