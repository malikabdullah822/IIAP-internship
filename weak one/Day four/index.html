<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4 Practical - Forms & Flexbox</title>
    <!-- Connects our external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation bar built using Flexbox -->
    <header class="navbar">
        <div class="logo">Airport IT</div>
        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">Support</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- Main container wrapper -->
    <main class="main-container">
        <h1>Airport IT Internship - Day 4 Practical</h1>
        <p class="subtitle">Mastering HTML Forms, Input Types, and Flexbox Layouts</p>

        <!-- Hands-on Responsive Contact Form -->
        <div class="form-card">
            <h2>Get in Touch</h2>
            
            <!-- HTML Form element wrapping user inputs -->
            <form action="#" method="POST">
                
                <!-- Text input group -->
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                </div>

                <!-- Email input group -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required>
                </div>

                <!-- Select Dropdown group -->
                <div class="form-group">
                    <label for="department">Support Department</label>
                    <select id="department" name="department">
                        <option value="network">Network Infrastructure</option>
                        <option value="hardware">Hardware Support</option>
                        <option value="cyber">Cybersecurity Desk</option>
                    </select>
                </div>

                <!-- Radio Button group -->
                <div class="form-group">
                    <label>Priority Level:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="priority" value="normal" checked> Normal</label>
                        <label><input type="radio" name="priority" value="urgent"> Urgent</label>
                    </div>
                </div>

                <!-- Checkbox group -->
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the internal IT policies</label>
                </div>`

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">Submit Request</button>

            </form>
        </div>
    </main>

</body>
</html>
