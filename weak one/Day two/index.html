<!DOCTYPE html>
<html lang="en">
<head>
    
    <!-- Defines character encoding for the document (supports special characters) -->
    <meta charset="UTF-8">  
    
    <!-- Ensures proper scaling and responsiveness on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Sets the title of the webpage displayed on the browser tab -->
    <title>Day 2 Practical - Airport IT Internship</title>

<!-- Loads a custom Google Web Font (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    

    <!-- Links the external CSS stylesheet for styling -->
    <link rel="stylesheet" href="style.css">

</head>
<body>
    

<!-- Navigation Header using Anchor Tags -->
    <header>
        <nav>
            <!-- Internal anchor jump link pointing to the section ID -->
            <a href="#about">About</a>
            <!-- Internal anchor jump link pointing to services -->
            <a href="#services">Services</a>
            <!-- External navigation link opening in a new tab -->
            <a href="https://www.google.com" target="_blank">External Link</a>
        </nav>
    </header>

    <main>
        <!-- Main heading tag (H1) -->
        <h1>Airport IT Internship - Day 2 Practical</h1>
        
        <!-- Subheading (H2) with an ID attribute for anchor tag navigation -->
        <h2 id="about">Mastering Intermediate HTML & CSS</h2>
        
        <!-- Paragraph tag containing body text -->
        <p>Today we are exploring advanced styling, custom web fonts, optimized images with alt text, and different CSS color formats like Hex, RGB, and HSL.</p>

        <!-- Optimized image container with alt text for accessibility -->
        <div class="image-box">
            <!-- IMPORTANT: Make sure you have a real image in this location, or change the src path to an image you have! -->
            <img src="pic/doctor.jpg" alt="Doctor holding a virtual medical healthcare icon" width="400">
        </div>
    </main>
</body>
</html>
