<!-- Declares the document type as HTML5 for modern web browsers -->
<!DOCTYPE html>

<!-- Opens the root <html> element and sets the primary language to English -->
<html lang="en">
<head>
    <!-- Sets character encoding to support standard text and special symbols -->
    <meta charset="UTF-8">

    <!-- Configures the viewport so the layout scales properly on mobile and desktop screens -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Sets the title that appears in your browser tab -->
    <title>Week 2 - Day 1 JavaScript & DOM</title>

    <!-- Connects your external CSS stylesheet to style the page layout -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main card container holding the interactive elements -->
    <div class="card">
        <!-- Main heading with an ID so JavaScript can find and modify it later -->
        <h1 id="main-title">Airport IT Terminal</h1>
        
        <!-- Paragraph containing system status text with an ID for dynamic updates -->
        <p id="status-text">System Status: Checking...</p>
        
        <!-- Interactive button with an ID to listen for user click events -->
        <button id="action-btn">Run Diagnostics</button>
    </div>

    <!-- Links the external JavaScript file at the end of the body -->
    <!-- Placing it here ensures all HTML elements load into the DOM before JavaScript runs -->
    <script src="script.js"></script>
</body>
</html>
