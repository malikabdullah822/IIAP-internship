<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airport IT Internship - Week 2: Day 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <h2>Airport Flight Tracker</h2>
        
        <div class="search-section">
            <input type="text" id="flight-input" placeholder="Enter Flight No (e.g., PK-303)">
            <button id="search-btn">Check Status</button>
        </div>

        <p id="status-result"></p>

        <div class="list-section">
            <h3>Active Terminal Flights:</h3>
            <ul id="flight-list"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
